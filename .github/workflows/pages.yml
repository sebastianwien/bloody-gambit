# Baut das Spiel bei jeder Änderung auf main und stellt es auf GitHub Pages online.
# Sind Typprüfung oder Tests rot, geht nichts raus.
name: Rollout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Ein laufender Rollout wird zu Ende geführt, der nächste wartet
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test
      # Statische Seite ohne Raumserver: der Menüpunkt Online erscheint nicht
      - run: npm run build:online
        env:
          VITE_ONLINE: 'off'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-online

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
